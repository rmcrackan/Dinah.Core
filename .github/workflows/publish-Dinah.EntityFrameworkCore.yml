# Publish Dinah.EntityFrameworkCore to nuget.org via Trusted Publishing

name: Dinah.EntityFrameworkCore publish to nuget
on:
  push:
    branches:
      - master
jobs:
  publish:
    name: Dinah.EntityFrameworkCore build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Build
        run: dotnet build Dinah.EntityFrameworkCore/Dinah.EntityFrameworkCore.csproj --configuration Release
      - name: Pack
        run: dotnet pack Dinah.EntityFrameworkCore/Dinah.EntityFrameworkCore.csproj --no-build --configuration Release -o nupkg
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: rmcrackan
      - name: PushNuget
        run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
