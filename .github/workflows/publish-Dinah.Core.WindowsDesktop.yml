# Publish Dinah.Core.WindowsDesktop to nuget.org via Trusted Publishing

name: Dinah.Core.WindowsDesktop publish to nuget
on:
  push:
    branches:
      - master
jobs:
  publish:
    name: Dinah.Core.WindowsDesktop build, pack & publish
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Build
        run: dotnet build Dinah.Core.WindowsDesktop/Dinah.Core.WindowsDesktop.csproj --configuration Release
      - name: Pack
        run: dotnet pack Dinah.Core.WindowsDesktop/Dinah.Core.WindowsDesktop.csproj --no-build --configuration Release -o nupkg
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: rmcrackan
      - name: PushNuget
        shell: pwsh
        run: |
          Get-ChildItem nupkg/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
          }
